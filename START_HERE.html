</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>/* HFI Retirement Journey 2.0 — pure, testable business rules. No network or AI. */
(function (root) {
'use strict';
const VERSION='2.0.0', POLICY='HFI draft rules 2.0';
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=p=>p+'-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const iso=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'') && !Number.isNaN(Date.parse(d)) && new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;
function days(d,n){if(!iso(d))throw Error('Enter a valid date.');let x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/86400000);
function amount(v){if(v===''||v===null||v===undefined||(typeof v==='string'&&!v.trim()))return null;let n=Number(v);if(!Number.isFinite(n)||n<0||n>Number.MAX_SAFE_INTEGER)throw Error('Use a finite, non-negative amount within supported precision; leave unknown amounts blank.');return n;}
function stage(c,now){if(!c.retirement)return 'Date uncertain';let d=diff(c.retirement,now);return d>365?'Planning ahead':d>=0?'Approaching retirement':d>=-365?'Recently retired':'Retired earlier';}
const terminal=s=>['Completed','Not applicable'].includes(s);
const roles=['FP','RM','AM','DM','AVP','COO','CEO'];
const catalogue=[
['picture','Your priorities and starting point',[],7,'Client','Agree priorities and review the information available.',['Retirement position discussed','Priorities and assistance preferences confirmed']],
['benefits','Service records and pension benefits',['picture'],21,'HFI','Review available estimates and keep unresolved amounts open.',['Source and pension basis recorded','Missing information and next review agreed']],
['cashflow','Income spending and commutation',['picture'],30,'HFI','Review the monthly position and record any undecided choices.',['Income and spending basis reviewed','Commutation decision or next discussion recorded']],
['assets','Investment and asset overview',['picture'],45,'Client','Organise holdings and identify what needs clarification.',['Available holdings recorded','Ownership and missing values reviewed']],
['alignment','Align investments with your goals',['cashflow','assets'],60,'HFI','Review goals, liquidity and investment suitability.',['Goal funding and liquidity discussed','Affordability and agreed action recorded']],
['health','Insurance and healthcare',['picture'],28,'Client','Review cover changes and healthcare access.',['Cover changes reviewed','Healthcare access issues recorded']],
['property','Property and housing plans',['picture'],90,'Client','Review relevant housing decisions and documentation.',['Plans and timing confirmed','Relevant documentation gaps recorded']],
['banking','Banking and outstanding obligations',['assets'],105,'Client','Review accounts, lockers, loans, guarantees and relevant legal cases.',['Relevant obligations reviewed','Outstanding actions assigned']],
['succession','Nominations and specialist referral',['picture'],120,'Client','Review readiness and coordinate specialist help where needed.',['Readiness status discussed','Referral or next action recorded']],
['folder','Your private family continuity folder',[],75,'Client','Use your own private folder; HFI records progress only.',['Client confirms records organised','Client confirms intended family access']],
['wishes','Family wishes and preparedness',['folder'],180,'Client','Help the family know where records are and whom to contact.',['Family contact arrangements discussed','Emergency guidance confirmed']],
['review','Family walkthrough and ongoing review',['alignment','health','banking','succession','wishes'],330,'HFI','Review unresolved matters and agree upkeep.',['Open exceptions reviewed','Next upkeep review agreed']]
];
const extra=[
['retirement-check','Final transition review',['benefits','cashflow','health'],0,'HFI','Review reliable benefit estimates and immediate retirement decisions.',['Latest available figures reviewed','Immediate decisions and pending receipts recorded']],
['receipts','Check actual retirement receipts',['benefits'],0,'HFI','Reconcile receipts against estimates without counting the same money twice.',['Receipts reconciled','Outstanding payments tracked']],
['settling','Review life after retirement',['cashflow'],0,'HFI','Compare actual income and spending with the plan.',['Actual cash flow reviewed','Changes and next review agreed']]
];
function inBranch(s,unit,root){let seen=new Set();while(unit&&!seen.has(unit)){if(unit===root)return true;seen.add(unit);unit=s.units?.find(x=>x.id===unit)?.parent;}return false;}
function allow(s,u,c,action='view') {if(!u||!u.active)return false;if(c&&!(u.scope==='all'||(inBranch(s,c.unit,u.unit))||(u.role==='FP'&&(c.owner===u.id||c.backup===u.id))))return false;if(u.role==='FP'&&c&&!['view'].includes(action)&&c.owner!==u.id&&c.backup!==u.id)return false;if(action==='admin')return ['CEO','COO'].includes(u.role);if(action==='approve')return s.roles.indexOf(u.role)>=s.roles.indexOf('RM');if(action==='override')return s.roles.indexOf(u.role)>=s.roles.indexOf('AM');return true;}
function requireAccess(s,u,c,a='edit'){if(!allow(s,u,c,a))throw Error('This action is outside this demonstration identity’s authority.');}
function audit(c,u,text){c.history.unshift({id:uid('event'),time:new Date().toISOString(),actor:u?.name||'System',text});}
function snapshot(c){return clone({version:c.version,approval:c.approval,retirement:c.retirement,confidence:c.confidence,facts:c.facts,rows:c.rows,milestones:c.milestones,approvedAt:c.approvedAt,verified:c.verified});}
function revise(c,u,reason){if(c.approval==='Approved'){if(c.approved)c.archives.push(clone(c.approved));c.version++;}else if(c.approval==='Pending approval'){c.version++;}c.approval='Draft';c.approvedAt=null;c.messages.forEach(m=>{if(m.status==='Approved')m.status='Needs review'});c.revisionReason=reason;audit(c,u,'Journey review required: '+reason);}
function schedule(c,now){let active=c.activated||now,near=c.retirement&&diff(c.retirement,now)>=0&&diff(c.retirement,now)<180;let plan=[...catalogue,...(c.retirement?extra:[])].map(([id,title,deps,offset,owner,help,checks])=>{let due=days(active,offset),phase='Preparation',basis=`${offset} days after journey start`;if(id==='retirement-check'){due=days(c.retirement,-30);basis='30 days before retirement';phase='Transition'}else if(id==='receipts'){due=days(c.retirement,30);basis='30 days after retirement';phase='After retirement'}else if(id==='settling'){due=days(c.retirement,90);basis='90 days after retirement';phase='After retirement'}else if(near&&['benefits','cashflow','health','assets','alignment'].includes(id)){let lead=id==='alignment'?14:37;due=[days(active,offset),days(c.retirement,-lead)].sort()[0];basis='Earlier of preparation target and '+lead+' days before retirement';}
if(due<now){due=days(now,7);basis+='; catch-up target requiring planner review';}if(id==='review'){phase='Upkeep';basis='Initial catch-up review about one year after joining';}return {id,title,deps:[...deps],due,originalDue:due,basis,phase,owner,status:'Planned',note:'',completion:null,checks:checks.map(text=>({text,done:false})),override:null,reviewOn:null,externalDeadline:null,deadlineSource:'',recheck:false,applicable:true,help};});for(let m of plan){let latest=m.deps.map(id=>plan.find(x=>x.id===id)?.due).filter(Boolean).sort().at(-1);if(latest&&latest>m.due){m.due=latest;m.originalDue=latest;m.basis+='; aligned with prerequisite targets';}}if(c.retirement&&diff(c.retirement,now)>365){let interval=c.facts?.checkin==='3 months'?90:180,end=days(c.retirement,90),target=days(plan.find(x=>x.id==='review').due,interval),n=1;while(target<end&&n<=40){plan.push({id:'checkin-'+n,title:'Periodic review '+n,deps:['picture'],due:target,originalDue:target,basis:interval+' day planning interval; confirm at each review',phase:'Ongoing review',owner:'HFI',status:'Planned',note:'',completion:null,checks:[{text:'Changes and uncertainties reviewed',done:false},{text:'Next contact and actions agreed',done:false}],override:null,reviewOn:null,recheck:false,help:'Revisit goals, source estimates, work possibilities and contribution affordability.',periodic:true});target=days(target,interval);n++;}}return plan;}
function conflicts(c){return c.milestones.flatMap(m=>m.deps.filter(id=>{let p=c.milestones.find(x=>x.id===id);return p&&!terminal(p.status)&&p.due>m.due}).map(id=>({id:m.id,dependency:id,reason:'Prerequisite target is later than this action'})));}
function blocked(c,m,now){if(m.override?.status==='Approved'&&m.override.reviewOn>=now)return [];return m.deps.filter(id=>{let p=c.milestones.find(x=>x.id===id);return !p||!terminal(p.status)||p.recheck});}
function generated(c,now){let fresh=schedule(c,now);return fresh.map(m=>{let old=c.milestones.find(o=>o.id===m.id);if(!old)return m;return {...m,...clone(old),...(old.manualDate||terminal(old.status)?{}:{due:m.due,basis:m.basis}),deps:m.deps};}).concat(c.milestones.filter(m=>terminal(m.status)&&!fresh.some(x=>x.id===m.id)).map(clone));}
function generate(s,u,c){requireAccess(s,u,c);if(!c.eligible)throw Error('Record the agreed HFI investment relationship before activating this journey.');revise(c,u,'Journey regenerated from current facts and timing');c.milestones=generated(c,s.clock);audit(c,u,'Draft generated; completion evidence and manually agreed dates retained.');}
function validateFacts(values){for(let[k,v]of Object.entries(values)){if(k.startsWith('money_'))amount(v);if(k==='dob'&&v&&!iso(v))throw Error('Date of birth must be a valid date.');if(k==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))throw Error('Enter a valid email address.');if(k==='commutationFactor')amount(v);if(k==='commutationPercent'&&v!==''&&(amount(v)>100))throw Error('Enter a percentage between 0 and 100. This does not establish permitted entitlement.');}}

faqs:[['What is this application for?','A guided retirement journey: understand facts, agree actions, verify completion and keep arrangements current. It supports a planner; it does not approve financial or legal decisions independently.'],['Who fills in the information?','Clients may complete short sections, or ask the planner to help. Existing HFI information is reused after checking its date and accuracy.'],['Why are there dates after retirement?','Some decisions are urgent before retirement. Organising records and reviewing actual income may continue afterwards. The planner explains each target and agrees a manageable pace.'],['I do not know my benefits yet.','Leave the amount unknown. We can progress independent work and review reliable figures when available.'],['Do I have to complete everything at once?','No. The client view offers one available action. You may request a call, a later date or help with a partial answer.'],['Should I upload my family folder?','No. Keep its contents and access credentials under family control. HFI records only your progress confirmation.'],['Does progress mean I am financially ready?','No. Progress is a count of completed applicable actions. Financial readiness needs a separate assessment of goals, facts and uncertainties.'],['Do I have to increase my SIP?','No. A review can result in increase, maintain, reduce, defer or no action, based on affordability and suitability. It is separate from completing other milestones.'],['Can HFI certify a Will or pension entitlement?','The appropriate specialist or service authority confirms legal and service outcomes. HFI can coordinate help and track the next step.'],['What does this draft store?','Fictional test records are saved in this browser. Sample attachments use browser storage if available. There are no real client logins, shared database or live messages.'] ],

</script><script>/* HFI V2 browser-local test application. All accounts and records are fictional. */
'use strict';
const E=window.HFI,C=window.HFIContent,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const money=n=>n===null||n===undefined||n===''?'Not known':'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const date=d=>E.iso(d)?new Date(d+'T12:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Not known';
const KEY='hfi-retirement-demo-v2',BOOT='hfi-v2-welcome';let state,storageOk=true,loadError=false;
try{state=JSON.parse(localStorage.getItem(KEY))||E.seed();if(state.schema!==2)throw Error('Unknown saved format');}catch{state=E.seed();loadError=true;}
let localRevision=state.revision,actorId='fp1',selected='HFI-1001',view='start',tab='overview',section='profile',portal=false,dirty=false,search='',filter='All',pending=null,fileDb=null;
const actor=()=>state.users.find(u=>u.id===actorId),client=()=>state.clients.find(c=>c.id===selected),visible=()=>state.clients.filter(c=>E.allow(state,actor(),c));
const btn=(text,action,attrs='',cls='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`;
const badge=x=>`<span class="badge ${['Completed','Approved','Reviewed','Active'].includes(x)?'green':['Rejected','Paused','Needs review'].includes(x)?'red':['Draft','Deferred','Clarification required'].includes(x)?'amber':'blue'}">${esc(x)}</span>`;
const notice=(s,w=false)=>`<div class="notice ${w?'warm':''}">${s}</div>`;
function toast(s){if($('#modal').open){let el=$('#modal .modalerror');if(!el){el=document.createElement('div');el.className='notice warm modalerror';el.setAttribute('role','alert');$('#modal').appendChild(el);}el.textContent=s;}$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',6500);}
function persist(){if(loadError)throw Error('Saved V2 data could not be read. Use Export unreadable data before resetting or restoring a valid export.');let disk;try{disk=JSON.parse(localStorage.getItem(KEY)||'null');}catch{}if(disk&&disk.revision!==localRevision)throw Error('Another tab changed this demo. Export unsaved notes if needed, then reload before editing.');state.revision++;try{localStorage.setItem(KEY,JSON.stringify(state));localRevision=state.revision;storageOk=true;}catch(e){state.revision--;storageOk=false;throw Error('Browser storage could not save the changes. Export the demo before closing and ask IT about browser storage.');}}
function mutation(fn){let before=E.clone(state);try{fn();persist();dirty=false;}catch(e){state=before;throw e;}}
function navigate(fn){if(dirty&&!confirm('You have unsaved answers. Leave this section without saving?'))return;dirty=false;fn();render();}
function modal(title,body,footer=''){let d=$('#modal');if(d.open)d.close();d.classList.remove('wide');d.innerHTML=`<div class="modalhead"><h2>${esc(title)}</h2>${btn('×','close','aria-label="Close dialog"')}</div>${body}<div class="modalfooter">${btn('Cancel','close')}${footer}</div>`;d.showModal();}
function close(){if($('#modal').open)$('#modal').close();}
function refresh(msg){close();render();if(msg)toast(msg);}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">HFI RETIREMENT JOURNEY · VERSION 2</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`;}
function field(k,label,type='',value=''){let control=Array.isArray(type)?`<select name="${k}" id="f_${k}"><option value="">Not provided</option>${type.map(t=>`<option ${String(value)===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${k}" id="f_${k}">${esc(value)}</textarea>`:`<input id="f_${k}" name="${k}" type="${['number','date','email','tel'].includes(type)?type:'text'}" ${type==='number'?'min="0" step="any"':''} value="${esc(value)}" ${type==='date'?'':'placeholder="Leave blank if not known"'}>`;return `<div class="field ${type==='textarea'?'full':''}"><label for="f_${k}">${esc(label)}</label>${control}</div>`;}
function render(){let u=actor();if(!u?.active){actorId=state.users.find(x=>x.active)?.id;u=actor();}if(!visible().some(c=>c.id===selected))selected=visible()[0]?.id;let nav=[['start','Start here'],['dashboard','Planner dashboard'],['clients','Client journeys'],['calendar','Tasks and calendar'],['approvals','Approvals and issues'],['knowledge','Guidance and packs'],['settings','Organisation and controls'],['feedback','Testing feedback']];$('#app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="crest">HF</div><div><strong>HUM FAUJI</strong><small>RETIREMENT JOURNEY</small></div></div><div class="navlabel">PLANNER WORKSPACE</div>${nav.map(([v,t])=>btn(t,'nav',`data-view="${v}"`,`nav ${view===v&&!portal?'active':''}`)).join('')}<div class="sidebottom"><b>By the Faujis. For the Faujis.</b>Draft 2.0 · Fictional information only</div></aside><main class="main"><header class="topbar"><div class="breadcrumb">${portal?'Client experience preview':'A guided journey for every family'}</div><div class="topright"><label for="identity" style="margin:0">Demo identity</label><select id="identity">${state.users.filter(x=>x.active).map(x=>`<option value="${x.id}" ${x.id===actorId?'selected':''}>${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select>${btn(portal?'Planner workspace':'Client preview','portal','','small')}</div></header><div class="demo"><span>V2 TEST BUILD · Local browser data · No real client logins or messages</span><span>Demo clock ${date(state.clock)}</span></div>${loadError?notice('Saved V2 data could not be read. Editing is paused to preserve it. '+btn('Export unreadable data','rawexport')+' '+btn('Reset V2 after export','reset'),true):''}${!storageOk?notice('Storage unavailable. Export before closing.',true):''}<section class="content" id="content">${portal?portalPage():view==='start'?startPage():view==='dashboard'?dashboard():view==='clients'?clientsPage():view==='client'?clientPage():view==='calendar'?calendar():view==='approvals'?approvals():view==='knowledge'?knowledge():view==='feedback'?feedbackPage():settings()}</section></main>`;}
function startPage(){return heading('A clear next step. A prepared family.','Start here whether this is your first visit or you tested Version 1.',btn('Open planner dashboard →','nav','data-view="dashboard"','primary'))+`<div class="card"><h2>What this app helps you do</h2><p>Understand the client’s position, verify information, agree a suitable retirement journey and guide each action through to completion. It serves clients years away, weeks away and already retired.</p><div class="journeyline">${['1 Understand','2 Verify','3 Agree journey','4 Guide action','5 Review and maintain'].map(x=>`<span>${x}</span>`).join('')}</div><p>Clients may answer short sections themselves or ask for a guided conversation. Existing HFI facts can be carried forward after checking their source and date. The next client action appears only after journey approval.</p></div><div class="grid"><div class="card"><h2>Your first ten minutes</h2><ol><li>Open <b>Col Arjun Mehta</b> and inspect the planner snapshot.</li><li>Open <b>Intake</b>. Save one short section and record its source review.</li><li>Open <b>Journey</b>. Changes to important facts create a draft; check dates and prerequisites.</li><li>Submit for approval, then switch to the Alpha RM identity to review it.</li><li>Preview the client’s next action, reply and return to the planner’s <b>Replies</b> tab.</li></ol>${btn('Open Arjun →','open','data-id="HFI-1001"','primary')}</div><div class="card"><h2>Useful boundaries for testing</h2><p>Each tester has an independent copy. The identity selector demonstrates permissions; it is not secure authentication. Use only made-up information and sample files.</p><p>Planning illustrations, file review, replies, printed journeys and task lists work locally. Live integrations, background messages and PDF/scan AI analysis require the production system.</p>${btn('See production readiness','nav','data-view="settings"')}<p class="muted" style="margin-top:12px">Your Version 1 browser data is not overwritten.</p></div></div><div class="card"><h2>Why work can continue after retirement</h2><p>Immediate decisions are brought forward. Family records, receipt reconciliation and follow-up may continue later. Every target has a stated basis and can be revised with a reason. Uncertain dates and amounts stay visibly uncertain.</p></div>`;}
function allTasks(){return visible().flatMap(c=>E.tasks(state,c)).sort((a,b)=>a.due.localeCompare(b.due));}
function taskRows(ts){return ts.length?ts.map(t=>{let c=state.clients.find(x=>x.id===t.client);return `<div class="task"><div class="taskbody"><strong>${esc(t.title)}</strong><small>${esc(c.name)} · ${esc(t.owner)} · ${date(t.due)} ${t.due<state.clock?'· Overdue':''}</small></div>${btn('Open →','task',`data-id="${c.id}" data-tab="${t.tab}"`,'small')}</div>`}).join(''):'<p class="muted">Nothing in this category.</p>';}
function dashboard(){let cs=visible(),ts=allTasks();return heading('Your team’s next useful actions',`${cs.length} clients within ${esc(actor().name)}’s demonstration scope.`,btn('+ Add fictional client','new','','primary'))+`<div class="stats">${[['Active journeys',cs.filter(c=>c.eligible&&!c.paused).length],['Due / overdue',ts.filter(t=>t.due<=state.clock).length],['Replies to review',cs.reduce((n,c)=>n+c.responses.filter(r=>r.status==='Pending review').length,0)],['Open issues',cs.reduce((n,c)=>n+c.issues.filter(i=>i.status==='Open').length,0)]].map(([t,n])=>`<div class="stat">${t}<b class="num">${n}</b></div>`).join('')}</div><div class="grid"><div class="card"><h2>Needs attention</h2>${taskRows(ts.slice(0,8))}</div><div class="card"><h2>Retirement stages</h2>${['Planning ahead','Approaching retirement','Recently retired','Retired earlier','Date uncertain'].map(x=>`<div class="fact"><span>${x}</span><b>${cs.filter(c=>E.stage(c,state.clock)===x).length}</b></div>`).join('')}<p class="muted" style="margin-top:18px">Client delay and external waits are labelled separately. Counts are work items, not a financial-readiness score.</p></div></div><div class="card"><h2>Client journeys</h2>${clientTable(cs)}</div>`;}
function clientTable(cs){return `<div class="tablewrap"><table><thead><tr><th>Client</th><th>Retirement</th><th>Journey</th><th>Next planner action</th><th></th></tr></thead><tbody>${cs.map(c=>{let t=E.tasks(state,c)[0];return `<tr><td><strong>${esc(c.name)}</strong><small>${esc(c.id)} · ${esc(c.unit)}</small></td><td>${date(c.retirement)}<small>${esc(c.confidence)} · ${E.stage(c,state.clock)}</small></td><td>${badge(c.paused?'Paused':c.approval)}<small>${c.milestones.filter(m=>m.status==='Completed').length} completed; ${c.milestones.filter(m=>m.status==='Not applicable').length} not applicable</small></td><td>${esc(t?.title||'Review upkeep')}</td><td>${btn('Open →','open',`data-id="${c.id}"`,'small')}</td></tr>`}).join('')}</tbody></table></div>`;}
function clientsPage(){let cs=visible().filter(c=>(c.name+' '+c.id).toLowerCase().includes(search.toLowerCase())&&(filter==='All'||E.stage(c,state.clock)===filter));return heading('Client journeys','Search by name or reference.',btn('+ Add fictional client','new','','primary'))+`<div class="card"><div class="toolbar"><label>Search<input id="search" value="${esc(search)}" placeholder="Name or HFI reference"></label><label>Stage<select id="stageFilter">${['All','Planning ahead','Approaching retirement','Recently retired','Retired earlier','Date uncertain'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div id="clientresults">${clientTable(cs)}</div></div>`;}
function clientPage(){let c=client();if(!c)return notice('No clients in this scope.');let tabs=['overview','intake','records','analysis','journey','documents','responses','messages','history'];return heading(esc(c.name),`${esc(c.id)} · ${esc(c.service)} · ${E.stage(c,state.clock)} · ${date(c.retirement)} (${esc(c.confidence)})`,`<div class="actions">${btn('Journey document','print')}${btn('Record life event','life','','primary')}</div>`)+`${c.paused?notice('Routine work paused: '+esc(c.pauseReason),true):''}${c.approval!=='Approved'?notice(`Current version ${c.version} is ${esc(c.approval)}. ${c.approved?'The previous approved snapshot is retained.':'Client actions begin after approval.'}`,true):''}<div class="tabs">${tabs.map(t=>btn(t==='responses'?'Replies':t[0].toUpperCase()+t.slice(1),'tab',`data-tab="${t}"`,`tab ${t===tab?'active':''}`)).join('')}</div>${tab==='overview'?overview(c):tab==='intake'?intake(c):tab==='records'?records(c):tab==='analysis'?analysis(c):tab==='journey'?journey(c):tab==='documents'?documents(c):tab==='responses'?responses(c):tab==='messages'?messages(c):history(c)}`;}
function overview(c){let tasks=E.tasks(state,c);return `<div class="grid"><div class="card"><h2>Planner snapshot</h2><p>${esc(c.facts.priorities||'Priorities not yet confirmed.')}</p><div class="fact"><span>Retirement</span><b>${date(c.retirement)} · ${esc(c.confidence)}</b></div>${c.possibleRetirement?`<div class="fact"><span>Possible date — not confirmed</span><b>${date(c.possibleRetirement.date)}</b></div>`:''}<div class="fact"><span>Current monthly income / spending</span><b>${money(c.facts.money_income)} / ${money(c.facts.money_expenses)}</b></div><div class="fact"><span>Pension quoted / source</span><b>${money(c.facts.money_pensionQuoted)} · ${esc(c.facts.pensionStatus||'Not known')}</b></div><div class="fact"><span>Commutation</span><b>${esc(c.facts.commutation||'Not known')}</b></div><div class="fact"><span>Source checks</span><b>${Object.values(c.verified).filter(x=>x.status==='Reviewed').length} sections reviewed</b></div><div class="actions" style="margin-top:16px">${btn('Review intake','tab','data-tab="intake"')}${btn('Reuse sample HFI facts','prefill')}${btn('View calculations','tab','data-tab="analysis"')}${btn('View records','tab','data-tab="records"')}${btn('Print planner snapshot','internalsnapshot')}</div></div><div class="card"><h2>Ownership and relationship</h2><p>Primary: <b>${esc(state.users.find(u=>u.id===c.owner)?.name||c.owner)}</b><br>Backup: ${esc(state.users.find(u=>u.id===c.backup)?.name||c.backup)}<br>Branch: ${esc(c.unit)}</p><p>${badge(c.eligible?'HFI relationship agreed':'Prospect — intake only')}</p>${btn('Update relationship / assignment','assignment','','small')}<p style="margin-top:12px">Journey ${c.version} · ${esc(c.approval)}</p>${btn('Escalate an issue','issue')}${btn('Draft client message','draft')}${btn('Specialist referral','referral')}</div></div><div class="grid"><div class="card"><h2>Next planner actions</h2>${taskRows(tasks.slice(0,4))}</div><div class="card"><h2>Private family folder</h2><p class="muted">Client confirmation only. The folder and access credentials stay with the family.</p>${['records','access','guide'].map((x,i)=>`<div class="fact"><span>${['Records organised','Family access checked','Emergency guide prepared'][i]}</span>${badge(c.folder[x]?'Client confirms':'Not confirmed')}</div>`).join('')}<p class="muted">Last confirmation: ${date(c.folder.date)}</p>${btn('Record confirmation','folder')}</div></div>${referralPanel(c)}<div class="card"><h2>Open information and review flags</h2>${C.sections.map(s=>`<div class="fact"><span>${esc(s.title)}</span>${badge(c.verified[s.id]?.status||'Not reviewed')} ${btn('Open section','section',`data-section="${s.id}"`,'small')}</div>`).join('')}</div>`;}
function intake(c){let sec=C.sections.find(s=>s.id===section)||C.sections[0];return `<div class="sectionnav">${C.sections.map(s=>btn(s.title,'section',`data-section="${s.id}"`,section===s.id?'primary small':'small')).join('')}</div><form id="intakeform"><div class="card"><div class="eyebrow">HFI Form: Your Retirement, Your Priorities · General planning information</div><h2 style="margin-top:12px">${sec.title}</h2><p class="muted">${sec.help}</p><div class="fields">${sec.fields.map(([k,l,t])=>field(k,l,t,c.facts[k]??'')).join('')}</div><div class="notice">Source status: ${badge(c.verified[section]?.status||'Not reviewed')} ${esc(c.verified[section]?.source||'No source recorded yet')}. Saving an answer does not verify it.</div></div><div class="savebar"><span id="savestatus">${dirty?'Unsaved answers':'Answers saved in this browser'}</span><div class="actions"><button type="submit" class="primary">Save this section</button>${btn('Record source review','verify')}${btn('Next section →','nextsection')}</div></div></form>`;}
function records(c){return `<div class="notice">Structured tables replace the combined text boxes. Use blank for an unknown amount. Detailed investment onboarding is tracked as a status; do not enter PAN, Aadhaar or bank credentials in this test build.</div>${Object.entries(C.rowTypes).map(([k,t])=>`<div class="card"><div class="cardhead"><h2>${t.title}</h2>${btn('+ Add','row',`data-kind="${k}"`,'small')}</div><p class="muted">${t.help}</p>${c.rows[k].length?`<div class="tablewrap"><table><thead><tr>${t.fields.slice(0,6).map(x=>`<th>${esc(x[1])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${c.rows[k].map(r=>`<tr>${t.fields.slice(0,6).map(([f,,type])=>`<td>${esc(type==='asset'?c.rows.assets.find(a=>a.id===r[f])?.name||'Not linked':type==='goal'?c.rows.goals.find(a=>a.id===r[f])?.name||'Not linked':r[f]??'Not known')}</td>`).join('')}<td>${btn('Edit','row',`data-kind="${k}" data-id="${r.id}"`,'small')}${btn('Remove','deleterow',`data-kind="${k}" data-id="${r.id}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No records yet. Leave unknown details for discussion.</p>'}</div>`).join('')}`;}
function analysis(c){let cf=E.cashflow(c),g=E.goalResults(c),cm=E.commutation(c);return decisionPanel(c)+`<div class="card"><div class="cardhead"><h2>Monthly retirement cash flow</h2>${btn('Edit calculation inputs','section','data-section="analysis"')}</div><p>Period: ${date(c.facts.cashflowAsOf)}. Pension basis: ${esc(c.facts.pensionNetBasis||'Not confirmed')}.</p><div class="stats">${[['Net income',cf.income],['Monthly outgo',cf.outgo],['Surplus / shortfall',cf.balance]].map(([t,n])=>`<div class="stat">${t}<b class="num" style="font-size:24px">${money(n)}</b></div>`).join('')}</div>${cf.missing.length||!cf.comparable?notice('An incomplete or non-comparable monthly position is not shown as a surplus. Confirm the period, net pension basis and all six amounts; enter zero only where there is genuinely none.',true):notice('Arithmetic illustration based on the supplied inputs. Review sources and irregular costs before using it for a decision.')}<p>Source / assumptions: ${esc(c.facts.calculationSource||'Not recorded')}</p></div><div class="card"><h2>Goal funding comparison</h2><p>Illustrative goal cost versus earmarked current assets. No investment growth, taxes or future contributions are assumed. Recurring goals need separate modelling.</p>${g.errors.map(x=>notice(esc(x),true)).join('')}<div class="tablewrap"><table><thead><tr><th>Goal</th><th>Illustrative future cost</th><th>Current assets earmarked</th><th>Difference before future investment growth</th></tr></thead><tbody>${g.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.future)}</td><td>${money(x.allocated)}</td><td>${g.errors.length?'Resolve allocation errors':money(x.gap)}</td></tr>`).join('')}</tbody></table></div>${btn('Edit goals and allocations','tab','data-tab="records"')}</div><div class="card"><h2>Commutation arithmetic illustration</h2><p>Basic monthly pension × chosen percentage gives the illustrative monthly basic-pension reduction. Multiplying that reduction by 12 and the supplied purchase factor gives an illustrative lump sum.</p><p>Monthly basic reduction: <b>${money(cm.reduction)}</b><br>Lump sum: <b>${cm.ready?money(cm.lump):'Source and effective date required'}</b></p>${notice('This does not calculate official entitlement, tax, DR treatment or restoration. It does not determine a permitted percentage or recommend a choice. The planner supplies and verifies the applicable official inputs.',true)}<p>Source: ${esc(c.facts.commutationSource||'Not recorded')} · ${date(c.facts.commutationDate)}</p></div><div class="card"><h2>Retirement receipts check</h2>${c.rows.benefits.map(b=>`<p>${esc(b.name)} · ${esc(b.status)} · ${money(b.amount)} ${b.status==='Received'?(b.asset?'· Linked to '+esc(c.rows.assets.find(a=>a.id===b.asset)?.name||'missing asset'):'· Receiving asset not linked — check double counting'):''}</p>`).join('')||'<p>No benefit entries.</p>'}</div>`;}
function journey(c){let problems=E.conflicts(c);return `<div class="card"><div class="cardhead"><div><h2>Agreed actions and timing</h2><span>${badge(c.approval)} · Version ${c.version}</span></div><div class="actions">${btn('Refresh proposed schedule','generate')}${c.approval==='Draft'?btn('Submit for RM approval','submitplan','','primary'):''}${c.approval==='Pending approval'&&E.allow(state,actor(),c,'approve')?btn('Approve journey','approveplan','','primary')+btn('Return for correction','rejectplan'):''}${btn('View approved snapshot','snapshot')}</div></div><p>Targets are planning defaults for review, not statutory deadlines. Work linked to retirement and work linked to joining are shown separately. Change dates with a reason.</p>${problems.length?notice(problems.map(p=>esc(c.milestones.find(m=>m.id===p.id).title+': '+p.reason)).join('<br>'),true):''}${[...c.milestones].sort((a,b)=>a.due.localeCompare(b.due)).map(m=>{let block=E.blocked(c,m,state.clock);return `<div class="milestone"><div class="stepnum ${m.status==='Completed'?'done':''}">${m.status==='Completed'?'✓':'•'}</div><div><h3>${esc(m.title)}</h3><p>${esc(m.help)}</p><small class="muted">${esc(m.phase)} · Owner: ${esc(m.owner)} · Target ${date(m.due)}<br>${esc(m.basis)}${m.manualDate?' · Manually agreed date':''}${m.externalDeadline?'<br>External deadline '+date(m.externalDeadline)+' · Source '+esc(m.deadlineSource):''}</small>${block.length?`<p class="blocktext">Waiting for: ${block.map(id=>esc(c.milestones.find(x=>x.id===id)?.title||id)).join(', ')}</p>`:''}${m.override?`<p>Exception ${esc(m.override.status)} · review ${date(m.override.reviewOn)}${m.override.reviewOn<state.clock?' · Expired':''}</p>`:''}${m.recheck?notice('Changed facts require this completed item to be reviewed again.',true):''}${m.note?`<p>Review note: ${esc(m.note)}</p>`:''}<div class="actions">${btn('Update checklist / date','milestone',`data-id="${m.id}"`,'small')}${block.length?btn('Request exception','override',`data-id="${m.id}"`,'small'):''}${C.packs[m.id]?btn('Open action pack','pack',`data-id="${m.id}"`,'small'):''}</div></div><div>${badge(m.status)}</div></div>`}).join('')}</div>`;}
function documents(c){return `<div class="card"><div class="cardhead"><h2>Planning documents</h2>${btn('+ Add sample file','upload','','primary')}</div>${notice('Fictional sample files only. Files are stored locally in this browser where supported. Text files can propose recognised fields; PDF, Word and scans require manual review in this draft. No automatic AI verification.')}${c.docs.map(d=>`<div class="task"><div class="taskbody"><strong>${esc(d.name)}</strong><small>${esc(d.type)} · ${date(d.date)} · Version ${d.version} ${d.replaces?'· Replaces '+esc(d.replaces):''}</small><p>${esc(d.note||'')}</p>${badge(d.status)}${d.candidates?.length?` · ${d.candidates.length} candidate fields to review`:''}</div><div class="actions">${d.hasFile?btn('Open file','openfile',`data-id="${d.id}"`,'small'):''}${btn('Review','reviewdoc',`data-id="${d.id}"`,'small')}${d.candidates?.length?btn('Compare candidates','candidates',`data-id="${d.id}"`,'small'):''}${btn('Delete sample','deletedoc',`data-id="${d.id}"`,'small')}</div></div>`).join('')||'<p>No documents yet. Client messages appear in Replies.</p>'}</div>`;}
function responses(c){return `<div class="card"><h2>Client replies and requests for help</h2><p>Review the response, then explicitly complete the relevant milestone when its checks are satisfied.</p>${c.responses.map(r=>`<div class="task"><div class="taskbody"><strong>${esc(r.kind)} · ${esc(c.milestones.find(m=>m.id===r.milestone)?.title||r.milestone)}</strong><p>${esc(r.text)}</p>${badge(r.status)}<small>${date(r.date)}${r.review?' · '+esc(r.review):''}</small></div>${r.status==='Pending review'?btn('Review response','reviewreply',`data-id="${r.id}"`,'small'):''}</div>`).join('')||'<p class="muted">No client replies yet.</p>'}</div>`;}
function messages(c){return `<div class="card"><div class="cardhead"><h2>Client communications</h2>${btn('+ Draft message','draft','','primary')}</div><p>No message is sent automatically. After approving and sending through an authorised company channel, record the dispatch separately.</p>${c.messages.map(m=>`<div class="message"><h3>${esc(m.subject)}</h3><p style="white-space:pre-wrap">${esc(m.body)}</p>${badge(m.status)}<div class="actions">${btn('Edit','editmessage',`data-id="${m.id}"`)}${btn('Copy','copymessage',`data-id="${m.id}"`)}${m.status==='Draft'||m.status==='Needs review'?btn('Approve draft','approvemessage',`data-id="${m.id}"`):''}${m.status==='Approved'?btn('Record manual dispatch','dispatch',`data-id="${m.id}"`):''}</div>${m.sentAt?`<small>Manual dispatch recorded ${esc(m.sentAt)} · ${esc(m.channel)}</small>`:''}</div>`).join('')||'<p class="muted">No messages yet.</p>'}</div>`;}
function history(c){return `<div class="card"><h2>Activity and retained journey versions</h2><p class="muted">A browser-local demonstration history, not a tamper-proof production audit.</p><p>${c.archives.length} previous approval snapshots retained.</p>${c.archives.map((a,i)=>btn('View v'+a.version,'archive',`data-index="${i}"`,'small')).join('')}<div class="timeline" style="margin-top:20px">${c.history.map(e=>`<div class="event"><strong>${esc(e.text)}</strong><small>${esc(e.actor)} · ${new Date(e.time).toLocaleString('en-IN')}</small></div>`).join('')}</div></div>`;}
function approvals(){let cs=visible();return heading('Approvals and exceptions','FP → RM → AM → DM → AVP → COO / CEO. Exact authority is demonstrated, pending production enforcement.')+`<div class="card"><h2>Journey approvals</h2>${cs.filter(c=>c.approval==='Pending approval').map(c=>`<div class="task"><strong class="taskbody">${esc(c.name)} · v${c.version}</strong>${btn('Review journey','task',`data-id="${c.id}" data-tab="journey"`)}</div>`).join('')||'<p>No journeys awaiting approval.</p>'}</div><div class="card"><h2>Issues and dependency exceptions</h2>${cs.flatMap(c=>c.issues.map(i=>`<div class="task"><div class="taskbody"><strong>${esc(i.title)}</strong><small>${esc(c.name)} · With ${esc(i.level)} · ${date(i.created)}</small><p>${esc(i.reason)}</p>${badge(i.status)}${i.resolution?`<p>Decision: ${esc(i.resolution)}</p>`:''}</div><div class="actions">${btn('Open client','open',`data-id="${c.id}"`,'small')}${i.status==='Open'?btn('Escalate','escalate',`data-client="${c.id}" data-id="${i.id}"`,'small')+btn('Record decision','resolve',`data-client="${c.id}" data-id="${i.id}"`,'small'):''}</div></div>`)).join('')||'<p>No issues.</p>'}</div>`;}
function calendar(){let ts=allTasks();return heading('Tasks and calendar','Dates are taken from the current journey, reviews and outstanding replies.',`<div class="actions">${btn('Export calendar .ics','calendarExport')}${btn('Prepare due reminders','reminders','','primary')}</div>`)+notice('The task list works while this draft is open. Calendar export uses your calendar application. Background reminders and delivery are production dependencies.')+`<div class="card"><h2>Today and overdue</h2>${taskRows(ts.filter(t=>t.due<=state.clock))}</div><div class="card"><h2>Upcoming</h2>${taskRows(ts.filter(t=>t.due>state.clock).slice(0,40))}</div>`;}
function knowledge(){return heading('Guidance and milestone packs','Approved content and templates will be governed by HFI. These draft packs support the next testing round.')+`<div class="card"><h2>Common questions</h2><input id="faqsearch" placeholder="Search guidance" aria-label="Search guidance"><div id="faqresults">${faq('')}</div></div><div class="card"><h2>Reusable action packs</h2>${Object.entries(C.packs).map(([id,p])=>`<div class="task"><strong class="taskbody">${esc(p.title)}</strong>${btn('Open pack','pack',`data-id="${id}"`)}</div>`).join('')}</div><div class="card"><h2>Controlled improvement register</h2>${btn('Suggest improvement','idea')}${state.ideas.map(i=>`<div class="task"><div class="taskbody"><strong>${esc(i.text)}</strong><small>${esc(i.status)}</small></div>${E.allow(state,actor(),null,'admin')&&i.status==='Proposed'?btn('Approve preparation','approveidea',`data-id="${i.id}"`):''}</div>`).join('')}<p class="muted">Approval prepares a change for review and testing. It never rewrites live rules automatically.</p></div>`;}
function faq(q){return C.faqs.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).map(([q,a])=>`<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p><small>HFI draft guidance v2 · 24 Oct 2026 · planner review required</small></details>`).join('')||'<p>No approved answer found. Please refer this to the planner.</p>';}
function settings(){return heading('Organisation and controls','Company control, permission demonstrations and explicit production dependencies.')+`<div class="grid"><div class="card"><h2>Management levels</h2>${state.roles.map((r,i)=>`<div class="fact"><span>${i+1}. ${esc(r)}</span></div>`).join('')}${E.allow(state,actor(),null,'admin')?btn('Add management level','addlevel')+btn('Manage branches','unit'):''}<p style="margin-top:14px">${state.units.map(u=>esc(u.name)+' → '+esc(state.units.find(x=>x.id===u.parent)?.name||'Root')).join('<br>')}</p><p class="muted">CEO and COO use distinct demonstration identities. Production access also depends on branch and action.</p></div><div class="card"><h2>Demo data and clock</h2><label for="clock">Demo date<input id="clock" type="date" value="${state.clock}"></label>${btn('Apply demo date','clock')}${btn('Export test records','export')}${btn('Import V2 test records','import')}${btn('Reset V2 fictional data','reset','','danger')}<p class="muted">Exports contain demo records, not attachment files. Version 1 records remain untouched. No external service is connected.</p></div></div><div class="card"><h2>People and branch assignments</h2>${state.users.map(u=>`<div class="fact"><span>${esc(u.name)} · ${esc(u.role)} · ${esc(u.scope||u.unit||'No branch')}</span>${badge(u.active?'Active':'Inactive')}</div>`).join('')}${E.allow(state,actor(),null,'admin')?btn('Add / update demonstration identity','user'):''}</div><div class="card"><h2>Production readiness register</h2><p>These dependencies remain explicit. A passing draft test does not approve live client use.</p>${C.releaseGates.map(([t,o,d])=>`<div class="task"><div><h3>${esc(t)}</h3><p>${esc(d)}</p><small class="muted">Owner: ${esc(o)} · Not connected / not accepted</small></div></div>`).join('')}</div>`;}
function feedbackPage(){return heading('Testing feedback','Record the exact client, identity, steps and expected result. Export this at the end of the session.',btn('Export feedback','feedbackExport'))+`<div class="card"><form id="feedbackform"><div class="fields">${field('tester','Tester name')}${field('testId','Test ID or screen')}${field('severity','Priority',['Blocker','High','Medium','Low','Known limitation'])}${field('clientRef','Client reference','',selected)}${field('steps','Steps and fictional inputs','textarea')}${field('expected','Expected result','textarea')}${field('actual','Actual result','textarea')}</div><button class="primary" type="submit">Save finding</button></form></div><div class="card"><h2>${state.feedback.length} saved findings</h2>${state.feedback.map(f=>`<p><b>${esc(f.tester)} · ${esc(f.testId)} · ${esc(f.severity)}</b><br>${esc(f.actual)}</p>`).join('')}</div>`;}
function portalPage(){let c=client();if(!c)return notice('No client available.');let a=c.responses.some(r=>r.status==='Pending review')?[]:E.available(c,state.clock).filter(m=>m.owner==='Client').slice(0,1);return `<div class="portal"><div class="toolbar"><div class="eyebrow">CLIENT EXPERIENCE PREVIEW · ${esc(c.name)}</div><select id="portalclient" aria-label="Preview a client in this scope">${visible().map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="portalhero"><h1>Your retirement. Your priorities.</h1><p>We will take this one manageable step at a time. You can give a partial answer, request help or agree a later discussion.</p></div>${c.paused?notice('Routine actions are paused. Your HFI team will coordinate the appropriate support.',true):!c.eligible?notice('Your planner will discuss the investment relationship and next steps.'):c.approval!=='Approved'?notice('Your planner is reviewing the journey. New actions will appear once it is approved.'):a.length?`<div class="card"><h2>Your next action</h2><h1 style="font-size:25px">${esc(a[0].title)}</h1><p>${esc(a[0].clientPrompt||a[0].help)}</p><p>Suggested target ${date(a[0].due)}</p><div class="actions">${['Reply','Ask for help','Ask for more time'].map(k=>btn(k,'clientreply',`data-id="${a[0].id}" data-kind="${k}"`,k==='Reply'?'primary':'')).join('')}</div></div>`:notice('Your planner is reviewing the next step. There is nothing further to submit right now.')}<div class="card"><h2>What you have already sent</h2>${c.responses.slice(0,4).map(r=>`<p>${esc(c.milestones.find(m=>m.id===r.milestone)?.title)} · ${badge(r.status)}<br>${esc(r.text)}</p>`).join('')||'<p>No replies yet.</p>'}<p class="muted">Received replies stay in review until your planner confirms the next step.</p></div><div class="grid"><div class="card"><h2>Your approved journey</h2><p>Completed actions are not a financial-readiness score.</p>${btn('View approved journey','clientprint')}${btn('Complete a short intake section','clientintake')}${btn('Add a fictional supporting file','upload')}</div><div class="card"><h2>Your private family folder</h2><p>Keep it with your family. We only need your confirmation of progress.</p>${btn('Update my confirmation','folder')}</div></div><div class="card"><h2>Questions</h2>${faq('')}</div></div>`;}
/* Form dialogs and delivery helpers */
function formValues(){let f=$('#modal form');if(!f)throw Error('No active form.');if(!f.reportValidity())throw Error('Please check the highlighted answer.');return Object.fromEntries(new FormData(f));}
const form=body=>`<form id="dialogform"><div class="fields">${body}</div></form>`;
const saveButton=(text,action,attrs='')=>btn(text,action,attrs,'primary');
function validateUiFacts(values){for(let [key,value]of Object.entries(values)){let f=C.sections.flatMap(s=>s.fields).find(f=>f[0]===key);if(!f)continue;if(value!==null&&!['string','number'].includes(typeof value))throw Error('Unsupported value for '+f[1]);if(Array.isArray(f[2])&&value!==''&&value!==null&&!f[2].includes(value))throw Error('Unrecognised answer for '+f[1]+'. Review the source before accepting.');if(f[2]==='date'&&value&&!E.iso(value))throw Error('Invalid date for '+f[1]);if(f[2]==='number')E.amount(value);}E.validateFacts(values);}
function controls(fields,values={}){return fields.map(([k,l,t])=>field(k,l,t,values[k]??'')).join('');}
function pick(k,label,items,value=''){return `<div class="field"><label for="f_${k}">${esc(label)}</label><select id="f_${k}" name="${k}"><option value="">Not selected</option>${items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function editMilestone(id){let m=client().milestones.find(x=>x.id===id);pending={type:'milestone',id};modal(m.title,form(field('status','Progress',['Planned','Active','Completed','Not applicable','Deferred','Declined','Waiting externally','Under review','Clarification required'],m.status)+field('due','Agreed target','date',m.due)+field('reviewOn','Next review / external chase','date',m.reviewOn||'')+field('externalDeadline','External deadline, if source-confirmed','date',m.externalDeadline||'')+field('deadlineSource','Source for external deadline','',m.deadlineSource||'')+field('basis','Completion basis',['Planner reviewed evidence','Client declaration checked','Specialist confirmation recorded','Not applicable with reason'],m.completion?.basis||'')+`<div class="field full"><b>Completion checklist</b>${m.checks.map((x,i)=>`<label class="check"><input type="checkbox" name="check${i}" ${x.done?'checked':''}>${esc(x.text)}</label>`).join('')}${m.recheck?'<label class="check"><input type="checkbox" name="confirmRecheck">I reviewed the impact of the changed facts</label>':''}</div>`+field('note','Review evidence, open uncertainty or reason for change','textarea',m.note)),saveButton('Save milestone','savemilestone'));}

function messageDialog(m){let c=client(),next=E.available(c,state.clock)[0],p=C.packs[next?.id];pending={type:'message',id:m?.id};let body=m?.body||`Dear ${c.name},\n\n${p?.ask||'Let us review the next manageable step in your retirement journey together.'}\n\n${next?'Suggested next step: '+next.title+' by '+date(next.due)+'.\n\n':''}A partial answer is welcome. If you would prefer a short call or more time, please tell us. We will agree the next step with you.\n\nWarm regards,\nYour HFI team`;modal(m?'Edit message draft':'Draft a client message',notice('This creates a draft only. Approval and an actual external dispatch are separate.')+form(field('subject','Subject','',m?.subject||'Your retirement journey — next step')+field('body','Draft message','textarea',body)),saveButton('Save draft','savemessage'));}
function issueDialog(i){pending={type:'issue',id:i?.id,client:client().id};if(i)modal('Decision: '+i.title,form(field('decision','Explicit outcome',i.type==='Override'?['Approved','Rejected','Clarification required']:['Resolved','Rejected','Clarification required'])+field('note','Decision reason and next step','textarea')),saveButton('Record decision','saveresolve'));else modal('Raise an issue or clarification',form(field('title','Issue title')+field('reason','Context, impact and help needed','textarea')),saveButton('Raise issue','saveissue'));}
function rowDialog(kind,id){let c=client(),t=C.rowTypes[kind],r=c.rows[kind].find(x=>x.id===id)||{};pending={type:'row',kind,id};modal(t.title,notice(t.help)+form(t.fields.map(([k,l,type])=>type==='asset'?pick(k,l,c.rows.assets,r[k]):type==='goal'?pick(k,l,c.rows.goals,r[k]):field(k,l,type,r[k]??'')).join('')),saveButton('Save record','saverow'));}
function showFolder(){let c=client();modal('Private family folder — progress only',notice('Keep the contents, access links and credentials under family control. HFI does not need a copy.')+form(['records','access','guide'].map((k,i)=>`<div class="field full"><label class="check"><input name="${k}" type="checkbox" ${c.folder[k]?'checked':''}>${['Client confirms records are organised','Client confirms intended family members can find the records','Client confirms an emergency guide is prepared'][i]}</label></div>`).join('')+field('note','Optional progress note — no private details','textarea')),saveButton('Save confirmation','savefolder'));}
function withTimeout(p,ms=15000){return new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(Error('The local file operation took too long. Please try again or use another supported browser. No success has been recorded.')),ms);p.then(v=>{clearTimeout(timer);resolve(v)},e=>{clearTimeout(timer);reject(e)});});}
async function db(){if(fileDb)return fileDb;return await new Promise((resolve,reject)=>{let expired=false,r=indexedDB.open('hfi-v2-samples',1),timer=setTimeout(()=>{expired=true;reject(Error('Local file storage is blocked or slow. Close other copies and retry.'));},15000);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files');};r.onsuccess=()=>{clearTimeout(timer);if(expired){r.result.close();return;}fileDb=r.result;fileDb.onversionchange=()=>{fileDb.close();fileDb=null;};resolve(fileDb);};r.onerror=()=>{clearTimeout(timer);reject(Error('Local file storage is unavailable in this browser. Try the hosted preview or another supported browser.'));};r.onblocked=()=>{clearTimeout(timer);expired=true;reject(Error('Another tab is blocking local file storage. Close the other copy and retry.'));};});}
async function fileOp(method,id,value){let d=await db();return await new Promise((resolve,reject)=>{let tx=d.transaction('files',method==='get'?'readonly':'readwrite'),store=tx.objectStore('files'),req=method==='put'?store.put(value,id):store[method](id);let result,timer=setTimeout(()=>{tx.abort();reject(Error('Saving the sample took too long. Nothing was marked successful; please retry.'));},15000);req.onsuccess=()=>result=req.result;tx.oncomplete=()=>{clearTimeout(timer);resolve(result);};tx.onerror=tx.onabort=()=>{clearTimeout(timer);reject(Error('Sample-file storage failed. The record was not marked successful.'));};});}
const candidateKeys={money_pensionQuoted:'pension',pensionBasis:'pension',taxBasis:'pension',drBasis:'pension',pensionStatus:'pension',pensionSource:'pension',pensionDate:'pension',cpcBasis:'pension',cpcSource:'pension',money_income:'monthly',money_expenses:'monthly',money_emi:'monthly',money_contributions:'monthly',money_retiredSpend:'home',money_workExpected:'work'};
function candidatesFrom(text){return text.split(/\r?\n/).map(line=>{let i=line.indexOf('=');return i<0?null:{key:line.slice(0,i).trim(),value:line.slice(i+1).trim()};}).filter(x=>x&&candidateKeys[x.key]).map(x=>({...x,section:candidateKeys[x.key]}));}
async function uploadFile(){let startClient=selected,startActor=actorId;E.requireAccess(state,actor(),client());let v=formValues(),f=$('#samplefile').files[0];if(!f)throw Error('Select a fictional sample file.');if(f.size>5*1024*1024)throw Error('The draft accepts files up to 5 MB.');if(!/\.(pdf|docx|txt|png|jpe?g)$/i.test(f.name))throw Error('Use PDF, DOCX, TXT, PNG or JPG.');let bytes=await withTimeout(f.arrayBuffer()),digest=globalThis.crypto?.subtle?Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(n=>n.toString(16).padStart(2,'0')).join(''):f.name+':'+f.size+':'+f.lastModified;let c=client();if(c.docs.some(d=>d.digest===digest))throw Error('This exact sample is already recorded for this client.');let id=E.uid('doc'),candidates=/\.txt$/i.test(f.name)?candidatesFrom(new TextDecoder().decode(bytes)):[],old=c.docs.find(d=>d.id===v.replaces);await fileOp('put',id,new Blob([bytes],{type:f.type||'application/octet-stream'}));try{if(selected!==startClient||actorId!==startActor||!$('#modal').open)throw Error('The upload context changed. Reopen this client and retry.');mutation(()=>{E.requireAccess(state,actor(),c);c.docs.unshift({id,name:f.name,type:v.type||'Other planning document',date:state.clock,status:candidates.length?'Extraction ready':'Pending review',hasFile:true,digest,candidates,note:v.note||'',version:old?old.version+1:1,replaces:old?.name,previousId:old?.id});E.audit(c,actor(),'Sample file received: '+f.name+'. Manual verification required.');});}catch(e){await fileOp('delete',id);throw e;}refresh('Sample stored. Review its source and any proposed fields.');}
function showCandidates(id){let d=client().docs.find(x=>x.id===id);pending={type:'candidates',id};modal('Compare proposed fields',notice('Only labelled text fields are recognised in this draft. Select each fact to accept; nothing is silently replaced.')+form(d.candidates.map((x,i)=>`<div class="field full"><label class="check"><input type="checkbox" name="c${i}"> ${esc(C.sections.flatMap(s=>s.fields).find(f=>f[0]===x.key)?.[1]||x.key)}</label><p>Current: ${esc(client().facts[x.key]??'Not known')}<br>Proposed: ${esc(x.value)}<br>Source: ${esc(d.name)}</p></div>`).join('')),saveButton('Accept selected as unverified','applycandidates'));}
function showPack(id){let p=C.packs[id];modal(p.title,`<h3>Client request</h3><p>${esc(p.ask)}</p><h3>Planner checks</h3><p>${esc(p.check)}</p><h3>Gentle clarification</h3><p>${esc(p.clarify)}</p><h3>Follow-up and completion</h3><p>Agree the next date, record the reply in Replies, review the evidence and explicitly complete the checklist. If information remains missing, send only the outstanding questions.</p>`,btn('Download this pack','downloadpack',`data-id="${id}"`));}
function journeyDocument(c,snap,internal=false){let x=snap||E.snapshot(c),status=snap?'Approved snapshot':c.approval,ordered=x.milestones.filter(m=>!m.periodic).sort((a,b)=>a.due.localeCompare(b.due)),periodic=x.milestones.filter(m=>m.periodic),groups=[ordered.slice(0,7),ordered.slice(7)];if(internal)return `<article class="printjourney"><h1>HFI planner snapshot</h1><p>${esc(c.name)} · ${c.id} · v${x.version} · ${esc(status)}</p><p>Retirement: ${date(x.retirement)} (${esc(x.confidence)}). Source checks must be read alongside estimates.</p>${C.sections.map(s=>`<h2>${esc(s.title)}</h2><p>Review: ${esc(x.verified[s.id]?.status||'Not reviewed')} · ${esc(x.verified[s.id]?.source||'No source')}</p><table class="printtable">${s.fields.map(([k,l])=>`<tr><th>${esc(l)}</th><td>${esc(x.facts[k]??'Not known')}</td></tr>`).join('')}</table>`).join('')}</article>`;
let ahead=x.retirement&&E.diff(x.retirement,state.clock)>180,early=x.retirement&&E.diff(x.retirement,state.clock)<0;return `<article class="printjourney"><section class="printpage"><div class="eyebrow">HUM FAUJI INITIATIVES</div><h1>Your retirement. Your priorities.</h1><h2>${esc(c.name)}</h2><p>Journey version ${x.version} · ${esc(status)} · Prepared ${date(state.clock)}</p>${status!=='Approved'&&!snap?notice('DRAFT — for planner review. This is not an approved client instruction.',true):''}${c.paused?notice('Routine journey paused. Contact your HFI team for sensitive support.',true):''}<h2>A considered transition for you and your family</h2><p>Retirement changes how income, responsibilities and family decisions fit together. Preparing in manageable steps gives you time to consider choices, organise records and help loved ones find what they need.</p><p>${ahead?'You have time before retirement. We can start with priorities and the information available today, keeping uncertain benefits open and revisiting them when reliable details arrive.':early?'Your retirement has already begun. We will organise outstanding work over a manageable catch-up journey, prioritising immediate needs and maintaining progress over roughly a year.':'Retirement is approaching. We will bring forward immediate decisions and agree which remaining actions can continue after retirement.'}</p><p>Your priorities: ${esc(x.facts.priorities||'To be confirmed with your planner.')}</p><h2>How we will work together</h2><p>HFI will help organise the information, identify gaps, explain the next step and review progress. You can share readily available information, tell us what is uncertain and ask for help. A short conversation or partial answer is welcome.</p><p>We offer this journey within the agreed HFI investment relationship. An investment review can lead to maintaining, reducing, deferring or increasing contributions, depending on your capacity and needs.</p><p>Service retirement date: <b>${date(x.retirement)}</b> · ${esc(x.confidence)}. A possible extension or separate employment will be reviewed when the source position is clearer.</p><p class="muted">Fictional test output · HFI draft rules 2.0 · Page 1</p></section>${groups.map((ms,i)=>`<section class="printpage"><h1>${i?'Continue and maintain':'Your agreed action sequence'}</h1><p>Targets reflect retirement timing and the date you joined this journey. They may change by agreement. Dependencies and information gaps can affect progress.</p><table class="printtable"><thead><tr><th>Action and responsibility</th><th>Target and basis</th><th>Progress</th></tr></thead><tbody>${ms.map(m=>`<tr><td><b>${esc(m.title)}</b><br>${esc(m.owner==='Client'?'You, with HFI guidance':'HFI, with your input')}<br><small>${esc(m.help)}</small></td><td>${date(m.due)}<br><small>${esc(m.basis)}${m.manualDate?' · Agreed revision':''}</small></td><td>${esc(m.status)}${m.recheck?' — review needed':''}${m.reviewOn?'<br>Review '+date(m.reviewOn):''}</td></tr>`).join('')}</tbody></table>${i&&periodic.length?'<h2>Further periodic review targets</h2><p>'+periodic.map(m=>date(m.due)).join(' · ')+'. These targets will be reviewed when circumstances change.</p>':''}<p class="muted">Fictional test output · Page ${i+2}</p></section>`).join('')}<section class="printpage"><h1>Keep choices and uncertainties visible</h1><h2>Figures and decisions still to review</h2><p>Pension quoted: ${money(x.facts.money_pensionQuoted)} · ${esc(x.facts.pensionStatus||'Not known')}. Commutation basis: ${esc(x.facts.pensionBasis||'Not known')}. Tax / deductions: ${esc(x.facts.taxBasis||'Not known')}. DR: ${esc(x.facts.drBasis||'Not known')}.</p><p>Pay revision basis: ${esc(x.facts.cpcBasis||'Unknown — no assumption')}. Source / assumption: ${esc(x.facts.cpcSource||'Not recorded')}.</p><p>Commutation position: ${esc(x.facts.commutation||'Not yet discussed')}. Work after service: ${esc(x.facts.work||'Not yet known')}.</p><h2>Your private family continuity folder</h2><p>Keep detailed records and credentials under your family’s control. We ask only for confirmation that records are organised, intended family members can find them and an emergency guide is available. No folder link or password is needed.</p><h2>When circumstances change</h2><p>Tell your planner about a confirmed retirement-date change, work opportunity, family event or changed priority. We will review the affected actions and agree a revised journey. Legal and service authorities remain responsible for their specialist confirmations.</p><h2>The next conversation</h2><p>Please tell us if an action feels difficult or if you would prefer a call. We can agree a smaller step or a later discussion, while explaining what remains unresolved for you and your family.</p><p class="muted">Fictional test output · Page 4</p></section></article>`;}

function decisionPanel(c){return `<div class="card"><div class="cardhead"><h2>Investment capacity reviews</h2>${btn('Record review','investment')}</div><p>Record an outcome supported by the client’s circumstances. Do not equate milestone progress with investment sales.</p>${(c.investmentReviews||[]).map(r=>`<div class="task"><div><b>${esc(r.outcome)} · ${date(r.date)}</b><p>${esc(r.capacity)}<br>${esc(r.note)}</p><small>Review ${date(r.reviewOn)} · Trigger ${esc(r.trigger)} · Amount ${money(r.amount)}</small></div></div>`).join('')||'<p class="muted">No capacity reviews yet.</p>'}</div>`;}
function referralPanel(c){return (c.referrals||[]).length?`<div class="card"><h2>Specialist follow-up</h2>${c.referrals.map(r=>`<p><b>${esc(r.purpose)} · ${esc(r.status)}</b><br>${esc(r.note)}<br>Consent: ${esc(r.consent)} · Follow-up ${date(r.reviewOn)} · ${esc(r.provider)}</p>`).join('')}</div>`:'';}
function validateImport(s){if(s?.schema!==2||!Array.isArray(s.clients)||!Array.isArray(s.users)||!Array.isArray(s.roles)||!Array.isArray(s.units)||!E.iso(s.clock)||!s.users.some(u=>u.active&&u.role==='CEO'))throw Error('This is not a complete V2 test export.');for(let a of ['ideas','feedback'])if(!Array.isArray(s[a]))throw Error('Missing '+a);if(!['FP','RM','AM','DM','AVP','COO','CEO'].every(r=>s.roles.includes(r)))throw Error('Core management levels are missing.');for(let u of s.users)if(!s.roles.includes(u.role))throw Error('Unknown role in import.');let ids=new Set();for(let c of s.clients){if(ids.has(c.id))throw Error('Duplicate client reference.');ids.add(c.id);if(!c.facts||!c.rows||!c.verified||!c.folder||!s.users.some(u=>u.id===c.owner)||!s.units.some(u=>u.id===c.unit))throw Error('Incomplete client structure.');for(let k of ['milestones','docs','responses','messages','issues','history','lifeEvents','archives'])if(!Array.isArray(c[k]))throw Error('Missing client '+k);for(let k of Object.keys(C.rowTypes))if(!Array.isArray(c.rows[k]))throw Error('Missing records table '+k);if(c.retirement&&!E.iso(c.retirement))throw Error('Invalid retirement date.');validateUiFacts(c.facts);for(let [kind,rows]of Object.entries(c.rows)){let type=C.rowTypes[kind];if(!type)continue;for(let r of rows){if(typeof r.id!=='string')throw Error('Record identifier missing.');for(let [k,l,t]of type.fields){if(t==='number')E.amount(r[k]);if(t==='date'&&r[k]&&!E.iso(r[k]))throw Error('Invalid record date: '+l);}}}for(let m of c.milestones)if(!E.iso(m.due)||!Array.isArray(m.deps)||!Array.isArray(m.checks))throw Error('Invalid milestone structure.');}return true;}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;try{b.disabled=true;await action(b.dataset.action,b);}catch(err){toast(err.message||'The action could not be completed.');}finally{b.disabled=false;}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='intakeform'){if(!e.target.reportValidity())return;let v=Object.fromEntries(new FormData(e.target));mutation(()=>E.updateFacts(state,actor(),client(),section,v));render();toast('Section saved. Review the source before relying on these facts.');}else if(e.target.id==='feedbackform'){let v=Object.fromEntries(new FormData(e.target));if(!v.tester.trim()||!v.steps.trim()||!v.actual.trim())throw Error('Add tester name, steps and actual result.');mutation(()=>state.feedback.push({...v,id:E.uid('feedback'),date:state.clock,role:actor().role,version:E.VERSION}));render();toast('Finding saved.');}}catch(err){toast(err.message);}});
document.addEventListener('input',e=>{if(e.target.closest('#intakeform')){dirty=true;$('#savestatus').textContent='Unsaved answers';}if(e.target.id==='search'){search=e.target.value;$('#clientresults').innerHTML=clientTable(visible().filter(c=>(c.name+' '+c.id).toLowerCase().includes(search.toLowerCase())&&(filter==='All'||E.stage(c,state.clock)===filter)));}if(e.target.id==='faqsearch')$('#faqresults').innerHTML=faq(e.target.value);});
document.addEventListener('change',e=>{try{if(e.target.id==='identity'){let id=e.target.value;navigate(()=>{actorId=id;portal=false;});}if(e.target.id==='stageFilter'){filter=e.target.value;render();}if(e.target.id==='portalclient'){selected=e.target.value;render();}if(e.target.id==='clientsection'){if(!confirm('Changing section discards any unsaved answers in this dialog. Continue?')){e.target.value=pending.section;return;}action('clientintake',{dataset:{section:e.target.value}});}if(e.target.name==='id'&&pending?.type!=='row'&&$('#f_replacement')){let u=state.users.find(x=>x.id===e.target.value);if(u)for(let [k,v]of Object.entries({...u,scope:u.scope==='all'?'All branches':'Assigned branch',active:u.active?'Active':'Inactive'})){let el=$('#f_'+k);if(el&&k!=='id')el.value=v||'';}}}catch(err){toast(err.message);}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){toast('Another tab changed this demo. Reload before saving further changes.');}});
$('#modal').addEventListener('close',()=>$('#modal').classList.remove('wide'));
render();
</script></body></html>
